[workspace]
resolver = "2"
members = [
    "crates/tpt-model",
    "crates/tpt-model-derive",
    "crates/tpt-model-cli",
]

[workspace.package]
version = "0.1.0"
rust-version = "1.90"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-model"
authors = ["TPT Solutions"]

[workspace.dependencies]
tpt-model = { path = "crates/tpt-model", version = "0.1.0" }
tpt-model-derive = { path = "crates/tpt-model-derive", version = "0.1.0" }
serde = { version = "1.0", default-features = false }
uuid = { version = "1.28", default-features = false }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.13", default-features = false }
syn = { version = "3", features = ["full", "visit", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
