[package]
name = "tpt-model-cli"
description = "Squash/compact CLI for tpt-model: plans and applies removal of versions below a minimum supported version"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["cli", "migration", "squash", "schema", "versioning"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
publish = false
default-run = "tpt-model"

[lib]
name = "tpt_model_cli"
path = "src/lib.rs"

[[bin]]
name = "tpt-model"
path = "src/main.rs"
doc = false

[[bin]]
name = "cargo-tpt-model"
path = "src/bin/cargo-tpt-model.rs"
doc = false

[dependencies]
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true
tpt-model.workspace = true
tpt-crypto-stub.workspace = true

[dev-dependencies]
serde = { workspace = true, features = ["derive", "std"] }
